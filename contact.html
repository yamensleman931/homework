<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا | دليل الفعاليات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center" href="index.html">
                    <img src="assets/img/logo.jpg" alt="SVU Logo" width="40" height="40" class="d-inline-block align-text-top me-2 rounded-circle">
                    <span class="fw-bold">دليل فعاليات SVU</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
                        <li class="nav-item"><a class="nav-link" href="events.html">الفعاليات</a></li>
                        <li class="nav-item"><a class="nav-link" href="about.html">عن الدليل</a></li>
                        <li class="nav-item"><a class="nav-link active" href="contact.html">اتصل بنا</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="py-5">
        <div class="container">
            <h2 class="fw-bold text-center mb-4 text-primary">تواصل معنا</h2>

            <div class="row g-4 justify-content-center">
                <div class="col-md-7">
                    <div class="card p-4 shadow-sm border-0">
                        <h4 class="fw-bold mb-3">أرسل لنا استفسارك</h4>

                        <div id="alertBox"></div>

                        <form id="contactForm" novalidate>
                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold">الاسم الكامل *</label>
                                <input type="text" class="form-control" id="name" required placeholder="أدخل اسمك الكامل">
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold">البريد الإلكتروني *</label>
                                <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label fw-bold">الرسالة *</label>
                                <textarea class="form-control" id="message" rows="4" required placeholder="اكتب رسالتك هنا..."></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">إرسال الرسالة</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0">دليل فعاليات الجامعة الافتراضية السورية &copy; 2026</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
